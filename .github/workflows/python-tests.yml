name: Python Tests

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: Compile Python
        run: python -m py_compile collector/*.py

  live-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install runtime dependency
        run: python -m pip install -r requirements.txt
      - name: Public Binance smoke
        run: >-
          python collector/market_data_worker.py smoke
          --output-root smoke-output
          --symbols TWTUSDT,TRXUSDT
          --duration-seconds 20
